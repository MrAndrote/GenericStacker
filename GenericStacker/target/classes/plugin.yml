name: GenericStacker
version: 1.0.0
main: com.yourname.genericstacker.GenericStacker
api-version: '1.17'
description: Entity stacking plugin supporting massive entity stacks.
commands:
  genericstacker:
    description: GenericStacker admin commands
    permission: genericstacker.admin
    usage: /genericstacker reload
  killallentities:
    description: Clears all stacked entities cleanly across worlds
    aliases: [killallmobs, stackerkill]
    permission: genericstacker.admin
permissions:
  genericstacker.admin:
    default: op